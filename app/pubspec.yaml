name: statussozo
description: StatusSozo - browse, save and share status photos and videos you have already viewed, from folders you choose.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  hugeicons: ^1.0.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  share_plus: ^10.1.0
  video_player: ^2.9.0
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  generate: true
  uses-material-design: false
  assets:
    - assets/brand/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
