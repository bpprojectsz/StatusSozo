name: diag

# One-off diagnostic: lists icon names available in the installed hugeicons
# package. Manual only. Never add a push: trigger.
on:
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get > /dev/null
      - name: List candidate icon names
        working-directory: app
        run: |
          dir=$(grep -A8 'name: hugeicons' pubspec.lock >/dev/null && find "$HOME/.pub-cache/hosted" -maxdepth 3 -type d -name 'hugeicons-*' | head -1)
          echo "package dir: $dir" | tee /tmp/diag.log
          grep -rhoE "strokeRounded[A-Za-z0-9]*" "$dir/lib" | sort -u > /tmp/all_names.txt
          echo "total names: $(wc -l < /tmp/all_names.txt)" | tee -a /tmp/diag.log
          for p in File Document Legal License Book Bug Terminal Code Scroll Agreement Contract Note Paper Clipboard Shield Share Heart Star Help Question Message Mail Link Globe Code Github Open Source List; do
            echo "== $p" >> /tmp/diag.log
            grep -E "^strokeRounded${p}" /tmp/all_names.txt | head -14 >> /tmp/diag.log
          done
          echo "== existing AppIcons names resolve?" >> /tmp/diag.log
          grep -n "HugeIcons\." lib/widgets/icons/app_icons.dart | head -40 >> /tmp/diag.log
      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/cilog && cp /tmp/diag.log /tmp/cilog/diag.log 2>/dev/null || echo none > /tmp/cilog/diag.log
          cd /tmp/cilog
          git init -q -b ci-logs-diag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "diag log ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-diag
