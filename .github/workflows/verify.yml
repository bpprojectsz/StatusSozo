name: verify

# Manual only. Never add a push: trigger.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Commit resolved pubspec.lock
        run: |
          if [ -n "$(git status --porcelain app/pubspec.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/pubspec.lock
            git commit -m "chore: update pubspec.lock"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "pubspec.lock unchanged"
          fi

      - name: Generate localisation
        working-directory: app
        run: flutter gen-l10n

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Forbidden-pattern and layering gate
        working-directory: app
        run: sh tool/check_forbidden.sh

      - name: Tests
        working-directory: app
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "no tests yet"
          fi
