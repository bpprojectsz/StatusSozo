name: verify

# Manual only. Never add a push: trigger.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Toolchain
        run: flutter --version 2>&1 | tee -a /tmp/verify.log

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get 2>&1 | tee -a /tmp/verify.log

      - name: Commit resolved pubspec.lock
        run: |
          if [ -n "$(git status --porcelain app/pubspec.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/pubspec.lock
            git commit -m "chore: update pubspec.lock"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "pubspec.lock unchanged"
          fi

      - name: Inspect hugeicons (temporary)
        working-directory: app
        run: |
          python3 - <<'PYEOF' 2>&1 | tee -a /tmp/verify.log
          import json, os, re, glob
          cfg = json.load(open('.dart_tool/package_config.json'))
          pkg = [p for p in cfg['packages'] if p['name'] == 'hugeicons'][0]
          root = pkg['rootUri']
          root = root[7:] if root.startswith('file://') else root
          txt = open(root + '/lib/hugeicons.dart', errors='ignore').read()
          ids = set(re.findall(r'static const [A-Za-z<>, ]+ (strokeRounded[A-Za-z0-9]+)', txt))
          cands = ['Cancel01','ArrowLeft01','ArrowRight01','Tick02','Tick01','CheckmarkCircle01','CheckmarkCircle02','Download01','Download02','Download04','Share01','Share08','Delete02','Delete01','Play','Pause','Reload','Video01','Image01','Folder01','FolderLinks','FolderLibrary','FolderAdd','Settings01','Album01','Album02','Moon02','Moon01','HelpCircle','Star','StarCircle','Mail01','Shield01','InformationCircle','Info','Refresh','Alert02','Alert01','AlertCircle','Globe','Crown','Crown02','Link01','Image02']
          print('EXISTS', {c: ('strokeRounded'+c) in ids for c in cands})
          i = txt.find('class HugeIcon ')
          print('HUGEICON_CLASS_AT', i)
          for m in re.finditer(r'class HugeIcon\b', txt):
              print('CLASS', txt[m.start():m.start()+1800].replace(chr(10), ' | '))
              break
          for f in glob.glob(root + '/lib/**/*.dart', recursive=True):
              t = open(f, errors='ignore').read()
              if 'class HugeIcon ' in t and f.endswith('hugeicons.dart') is False:
                  print('CLASSFILE', f)
          print('FIRSTICON', re.findall(r'static const [^;]{0,80}strokeRoundedHome01[^;]{0,200};', txt)[:1])
          PYEOF

      - name: Generate localisation
        working-directory: app
        run: flutter gen-l10n 2>&1 | tee -a /tmp/verify.log

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos 2>&1 | tee -a /tmp/verify.log

      - name: Forbidden-pattern and layering gate
        working-directory: app
        run: sh tool/check_forbidden.sh 2>&1 | tee -a /tmp/verify.log

      - name: Tests
        working-directory: app
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test --reporter expanded 2>&1 | tee -a /tmp/verify.log
          else
            echo "no tests yet" | tee -a /tmp/verify.log
          fi

      - name: Publish log to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilog && cp /tmp/verify.log /tmp/cilog/verify.log 2>/dev/null || echo "no log" > /tmp/cilog/verify.log
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} at=$(date -u +%FT%TZ)" > /tmp/cilog/meta.txt
          cd /tmp/cilog
          git init -q -b ci-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "verify log ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
