name: build_android

# Manual only. Never add a push: trigger.
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "test: small arm64 release-mode APK signed with the debug key, published as a direct download on the Releases page. debug: arm64 debug APK artifact. release: signed AAB and APK, needs the four signing secrets."
        type: choice
        options:
          - test
          - debug
          - release
        default: test
      perf_overlay:
        description: "Show Flutter's performance overlay"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build_android
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.2"
          channel: stable
          cache: true

      - name: Toolchain
        run: |
          mkdir -p /tmp/cilog
          { flutter --version; java -version 2>&1; } 2>&1 | tee -a /tmp/cilog/build.log

      - name: Write release signing config
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret for $name" | tee -a /tmp/cilog/build.log
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Dependencies and localisation
        working-directory: app
        run: |
          set -o pipefail
          { flutter pub get && flutter gen-l10n; } 2>&1 | tee -a /tmp/cilog/build.log

      - name: Analyze, gate and test
        working-directory: app
        run: |
          set -o pipefail
          {
            flutter analyze --no-fatal-infos
            sh tool/check_forbidden.sh
            flutter test
          } 2>&1 | tee -a /tmp/cilog/build.log

      - name: Build test APK (arm64, release mode, debug-signed)
        if: ${{ inputs.build_type == 'test' }}
        working-directory: app
        env:
          ORG_GRADLE_PROJECT_allowDebugSigning: "true"
        run: |
          set -o pipefail
          DEFINE=""
          if [ "${{ inputs.perf_overlay }}" = "true" ]; then DEFINE="--dart-define=PERF_OVERLAY=true"; fi
          flutter build apk --release --target-platform android-arm64 $DEFINE 2>&1 | tee -a /tmp/cilog/build.log

      - name: Publish test APK as a release asset
        if: ${{ inputs.build_type == 'test' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          cp app/build/app/outputs/flutter-apk/app-release.apk statussozo-test-arm64.apk
          ls -l statussozo-test-arm64.apk | tee -a /tmp/cilog/build.log
          TAG="test-${GITHUB_RUN_NUMBER}"
          SHORT=$(git rev-parse --short HEAD)
          gh release create "$TAG" statussozo-test-arm64.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Test build ${GITHUB_RUN_NUMBER} (${SHORT})" \
            --notes "arm64 release-mode build signed with a temporary key. Uninstall any earlier test build before installing this one." 2>&1 | tee -a /tmp/cilog/build.log
          {
            echo "### Test APK"
            echo ""
            echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/statussozo-test-arm64.apk"
            echo ""
            echo "All test builds: https://github.com/${GITHUB_REPOSITORY}/releases"
          } >> "$GITHUB_STEP_SUMMARY"
          # Keep only the three newest test releases.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^test-' | tail -n +4 \
            | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes; done || true

      - name: Build debug APK
        if: ${{ inputs.build_type == 'debug' }}
        working-directory: app
        run: |
          set -o pipefail
          DEFINE=""
          if [ "${{ inputs.perf_overlay }}" = "true" ]; then DEFINE="--dart-define=PERF_OVERLAY=true"; fi
          flutter build apk --debug --target-platform android-arm64 $DEFINE 2>&1 | tee -a /tmp/cilog/build.log

      - name: Build release AAB and APK
        if: ${{ inputs.build_type == 'release' }}
        working-directory: app
        run: |
          set -o pipefail
          DEFINE=""
          if [ "${{ inputs.perf_overlay }}" = "true" ]; then DEFINE="--dart-define=PERF_OVERLAY=true"; fi
          flutter build appbundle --release --obfuscate --split-debug-info=symbols $DEFINE 2>&1 | tee -a /tmp/cilog/build.log
          flutter build apk --release --obfuscate --split-debug-info=symbols $DEFINE 2>&1 | tee -a /tmp/cilog/build.log

      - name: Upload debug APK
        if: ${{ inputs.build_type == 'debug' }}
        uses: actions/upload-artifact@v4
        with:
          name: statussozo-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload release artifacts
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: statussozo-release
          path: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload debug symbols
        if: ${{ inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: statussozo-symbols
          path: app/symbols
          if-no-files-found: warn

      - name: Publish log to ci-logs-build branch
        if: always()
        run: |
          mkdir -p /tmp/cilog
          [ -f /tmp/cilog/build.log ] || echo "no log" > /tmp/cilog/build.log
          echo "commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} type=${{ inputs.build_type }} at=$(date -u +%FT%TZ)" > /tmp/cilog/meta.txt
          cd /tmp/cilog
          git init -q -b ci-logs-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "build log ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs-build
